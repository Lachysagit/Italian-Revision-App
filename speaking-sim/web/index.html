<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speaking Exam Simulator</title>
</head>
<body>
    <h1>Speaking Exam Simulator</h1>

    <button id="start">Start</button>
    <button id="done" disabled>Finished Response</button>
    <button id="end" disabled>End session</button>

    <div id="transcript"></div>
    <!-- student-facing conversation surface. Only real turns are appended
         here, so its content mirrors the session history the examiner sees.
         Diagnostics must never be written here - that is what #log is for -->

    <div id="log"></div>
    <!-- diagnostic trace of every message that crosses the socket, including
         status and failed turns. Never treated as conversation -->

    <script src="client.js"></script>
</body>
</html>
