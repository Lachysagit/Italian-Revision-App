<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Speaking Exam Simulator</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="siteNav">
        <a href="/" class="current">Speaking</a>
        <a href="/listening">Listening</a>
    </nav>
    <!-- above the sticky #controls, so it scrolls away rather than competing
         with the turn buttons for the top of the window -->

    <h1 id="pageTitle">Speaking Exam Simulator</h1>

    <div id="controls">
        <button id="start">Start</button>
        <button id="done" disabled>Finished Response</button>
        <button id="pause" disabled>Pause</button>
        <!-- pausing stops the clock and the mic; a request already with the
             examiner still comes back and is heard before the pause bites -->
        <button id="end" disabled>End session</button>
        <button id="export">Export session</button>
        <!-- enabled by the save buttons below, and never disabled by the
             session state: the document is still wanted after the exam -->

        <div id="examTimer" hidden>5:00</div>
     
    </div>

    <div id="examSetup">
        <label for="languageSelect">Language</label>
        <select id="languageSelect"></select>
        <!-- the one setting worth a click every session, so it sits on the page
             rather than behind a modal -->

        <label for="studentName">Your name</label>
        <input id="studentName" type="text" autocomplete="given-name"
               placeholder="shown on this page only">
        <!-- NOT sent anywhere. It is saved in this browser's localStorage and
             used to head the page and any transcript saved from it. The
             examiner is never told a name and is instructed never to ask for
             one, so no student's identity joins their speech at the model
             boundary -->

        <label for="classSelect">Class</label>
        <select id="classSelect">
            <option value="">Private practice</option>
        </select>
        <label for="planSelect" id="planLabel" hidden>Exam</label>
        <select id="planSelect" hidden></select>
        <!-- the class's exam plans, when it has any: its default, or another
             one the teacher offers by name. Filled by classes.js -->
        <a id="myClasses" href="/classes">My classes</a>
        <button id="joinClass" type="button">Join a class</button>
        <!-- the class decides which teacher sees the exam, and its language.
             Filled by classes.js once the account is known -->

        <button id="settings" type="button">More Settings</button>
    </div>

    <p id="classHint" role="status" hidden></p>

    <p id="usageLine" role="status" hidden></p>
    <!-- today's speaking allowance, from /api/me and then from each examiner
         question. The server holds the real count; this is its reading -->
    <!-- says out loud that a class exam is visible to the teacher, so nobody
         sits one thinking it is private -->

    <div id="joinOverlay" hidden>
        <form id="joinModal" role="dialog" aria-labelledby="joinTitle">
            <h2 id="joinTitle">Join a class</h2>
            <label for="joinCodeInput">Class code from your teacher</label>
            <input id="joinCodeInput" type="text" autocomplete="off"
                   autocapitalize="characters" spellcheck="false" maxlength="16"
                   placeholder="ABCD-EFGH">
            <p id="joinError" role="alert" hidden></p>
            <div id="joinActions">
                <button id="joinCancel" type="button">Cancel</button>
                <button id="joinSubmit" type="submit">Join</button>
            </div>
        </form>
    </div>


    <div id="settingsOverlay" hidden>
        <div id="settingsModal" role="dialog" aria-labelledby="settingsTitle">
            <h2 id="settingsTitle">More Settings</h2>

            <label for="geminiKeySelect">Gemini API key</label>
            <select id="geminiKeySelect"></select>
            <!-- populated from /api/gemini-keys; the selected name rides on
                 the "start" message so the backend knows which key to bill -->

            <div id="settingsActions">
                <button id="settingsClose">Close</button>
            </div>
        </div>
    </div>
    <!-- unreachable while a session is running: the key choice is read once,
         at the start message, so changing it mid-exam would have no effect -->

    <div id="micOverlay" hidden>
        <div id="micModal" role="alertdialog" aria-labelledby="micTitle" aria-describedby="micReason">
            <h2 id="micTitle">Microphone blocked</h2>
            <p id="micReason"></p>
     
            <ol id="micSteps"></ol>
       
            <div id="micActions">
                <button id="micRetry" type="button">Try again</button>
                <button id="micDismiss" type="button">Close</button>
            </div>
        </div>
    </div>
 

    <div id="translateBox">
        <div id="translateHead">
            <h2 id="translateTitle">Quick translate</h2>
            <button id="translateDirection" type="button">&nbsp;</button>
      
        </div>

        <textarea id="translateInput" rows="4" autocomplete="off" maxlength="1000"
                  placeholder="type a sentence to translate&#10;&#10;Enter to translate, Shift+Enter for a new line"></textarea>
        <!-- maxlength matches the server's kMaxTranslateChars, so a pasted
             transcript is stopped at the box instead of at a 400 -->
        <div id="translateCount" aria-live="polite"></div>
        <!-- a textarea rather than an input: a sentence worth checking often
             runs past one line, and a box you can see all of is easier to fix
             a typo in than one that scrolls sideways -->

        <button id="translateGo" type="button">Translate</button>
        <div id="translateResult" hidden></div>
    </div>


    <div id="examNotice" role="alert" hidden></div>
    <!-- why an exam did not start, in words a student can act on. Filled by
         client.js when the server refuses a Start -->

    <div id="examLoading" hidden>
        <span class="dots"><i></i><i></i><i></i></span>
        <span>Preparing your exam - waiting for the examiner's first question</span>
    </div>


    <div id="transcript"></div>
    <!-- student-facing conversation surface, and the only surface on the page.
         Turns are grouped one question with its answer, so a pair can be saved
         on its own. Diagnostics go to the console via addLog(), never here -->

    <script type="module">
        import { initAccount } from "/account.js";
        import { initClasses } from "/classes.js";
        import { applyPreferredLanguage, applyAccountName, paintUsage }
            from "/client.js";
        //the four <script src> tags these replace had to be written in
        //dependency order, with a comment beside each one saying so. The
        //imports state the same thing in a way the browser enforces

        initAccount({
            onReady: (user) => {
                // the account is where the language lives, so it wins over
                // whatever this particular browser last saved. A change made
                // from the picker is written back to the account, which is
                // what makes deferring to it here safe
                applyPreferredLanguage(user.preferred_language);
                applyAccountName(user.name);
                // only fills an empty box, so it is an offer rather than an
                // override: a student who goes by something other than their
                // Google name types it once and keeps it
                initClasses();
                paintUsage(user.usage);
            },
        });
    </script>
</body>
</html>
