<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="siteNav">
        <a href="/">Speaking</a>
        <a href="/listening">Listening</a>
    </nav>

    <h1>Sign in</h1>

    <div id="signinCard">
        <p>Sign in with your school Google account to keep a record of your
           exams and to join a class.</p>

        <a id="signinButton" href="/auth/login">Sign in with Google</a>
        <!-- a plain link, not a fetch: the browser has to follow the redirect
             to accounts.google.com itself, and no JavaScript is involved -->

        <p id="signinNote">Your exams are saved to your account so a teacher
           can see your progress.</p>
    </div>
    <script src="account.js"></script>
    <script>initAccount();</script>
</body>
</html>
